<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>單字對對碰 - 英語單字配對挑戰</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Plus Jakarta Sans & Noto Sans TC -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    html, body {
      height: 100%;
      height: 100dvh;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      position: fixed;
      inset: 0;
      background-color: #0b132b !important;
    }
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: 'Plus Jakarta Sans', 'Noto Sans TC', system-ui, sans-serif;
      background: radial-gradient(ellipse at 50% 15%, #152342 0%, #0b132b 100%) !important;
      color: #f1f5f9;
    }

    #mainArea {
      position: relative;
      width: 100%;
      flex: 1 1 0%;
      min-height: 0;
      min-width: 0;
      background: transparent;
    }

    #gridContainer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: grid;
      background: transparent;
    }

    .card-item {
      position: relative;
      width: 100%;
      height: 100%;
      display: block;
    }

    /* 3D Flip Card Effect filling 100% of cell */
    .perspective-1000 {
      perspective: 1000px;
    }
    .card-inner {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease;
      transform-style: preserve-3d;
    }
    .card-inner.flipped {
      transform: rotateY(180deg);
    }
    .card-face {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 0.85rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0.5rem 0.75rem;
      box-shadow: 0 4px 12px -2px rgba(0, 0, 0, 0.35);
    }
    .card-back {
      transform: rotateY(180deg);
    }

    /* Selection Pulse */
    @keyframes selectPulse {
      0%, 100% { transform: scale(1.02); }
      50% { transform: scale(0.98); }
    }
    .card-selected {
      animation: selectPulse 1.2s infinite ease-in-out;
      box-shadow: 0 0 20px 4px rgba(56, 189, 248, 0.6) !important;
    }
    .card-selected-zh {
      animation: selectPulse 1.2s infinite ease-in-out;
      box-shadow: 0 0 20px 4px rgba(52, 211, 153, 0.6) !important;
    }

    /* Shake on mismatch */
    @keyframes shakeError {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }
    .card-shake {
      animation: shakeError 0.45s ease-in-out;
      border-color: #ef4444 !important;
      box-shadow: 0 0 16px rgba(239, 68, 68, 0.8) !important;
    }

    /* Fade match disappearance */
    .card-matched {
      opacity: 0 !important;
      transform: scale(0.7) !important;
      pointer-events: none !important;
      transition: all 0.4s ease-out !important;
    }

    /* Custom Scrollbar for Modal */
    .custom-scroll::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #475569;
      border-radius: 4px;
    }
  </style>
</head>
<body class="text-slate-100 flex flex-col justify-between p-2 sm:p-3 md:p-4 h-full w-full">

  <!-- Top Navigation & Dashboard (Fluid Full-Width) -->
  <header class="w-full flex-shrink-0 bg-slate-800/80 backdrop-blur-md rounded-2xl border border-slate-700/60 px-3 py-2 sm:px-5 sm:py-2.5 shadow-xl mb-1.5 sm:mb-2">
    <div class="flex items-center justify-between gap-2">
      <!-- Title & Mode Badge -->
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-sky-500 to-indigo-600 flex items-center justify-center text-white shadow-md text-base select-none">
          <svg class="w-5 h-5 text-sky-100" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <!-- Brain icon outline -->
            <path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 4.44-2.04z"/>
            <path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-4.44-2.04z"/>

          <p class="text-[10px] text-slate-400 hidden sm:block mt-0.5">點擊中英文卡片完成配對</p>

      </div>

          <span class="text-slate-400 text-[11px] hidden xs:inline">進度</span>

        <!-- Combo Streak -->

          <svg id="audioIconOff" class="w-4 h-4 sm:w-5 sm:h-5 hidden text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"/></svg>

  <!-- Custom Word List Input Modal -->

          <button id="saveCustomBtn" class="px-4 py-1.5 rounded-xl bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold text-xs shadow-md">儲存並開始</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // All original preset categories removed. Stored categories dictionary:
    let savedCategories = {
      "cat_default": {
        name: "基礎日常單字 (範例)",
        words: [
          { en: "apple", zh: "蘋果" },
          { en: "banana", zh: "香蕉" },
          { en: "orange", zh: "橘子" },
          { en: "cat", zh: "貓咪" },
          { en: "dog", zh: "狗狗" },
          { en: "sun", zh: "太陽" },
          { en: "moon", zh: "月亮" },
          { en: "star", zh: "星星" },
          { en: "book", zh: "書本" },
          { en: "pencil", zh: "鉛筆" }
        ]
      }
    };

    let currentCategoryId = "cat_default";
    let editingCategoryId = null; // Track if we are editing an existing category or creating new

    // Audio Context Setup for synthesizer sound effects
    let audioCtx = null;
    let audioEnabled = true;

    function getAudioContext() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) {
          audioCtx = new AudioContextClass();
        }
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    // Play click sound
    function playClickSound() {
      if (!audioEnabled) return;
      try {
        const ctx = getAudioContext();
        if (!ctx) return;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(300, ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.08);
      } catch (e) {
        console.error(e);
      }
    }

    // Play success chord (Major triad)
    function playMatchSound() {
      if (!audioEnabled) return;
      try {
        const ctx = getAudioContext();
        if (!ctx) return;
        const freqs = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
        freqs.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.05);
          gain.gain.setValueAtTime(0.18, ctx.currentTime + idx * 0.05);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.05 + 0.35);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + idx * 0.05);
          osc.stop(ctx.currentTime + idx * 0.05 + 0.35);
        });
      } catch (e) {
        console.error(e);
      }
    }

    // Play error low bass buzz
    function playErrorSound() {
      if (!audioEnabled) return;
      try {
        const ctx = getAudioContext();
        if (!ctx) return;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, ctx.currentTime);
        osc.frequency.linearRampToValueAtTime(110, ctx.currentTime + 0.25);
        gain.gain.setValueAtTime(0.25, ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.25);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.25);
      } catch (e) {
        console.error(e);
      }
    }

    // Play victory fanfare
    function playVictorySound() {
      if (!audioEnabled) return;
      try {
        const ctx = getAudioContext();
        if (!ctx) return;
        const notes = [
          { f: 523.25, d: 0.15 },
          { f: 659.25, d: 0.15 },
          { f: 783.99, d: 0.15 },
          { f: 1046.50, d: 0.45 }
        ];
        let offset = 0;
        notes.forEach(note => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(note.f, ctx.currentTime + offset);
          gain.gain.setValueAtTime(0.25, ctx.currentTime + offset);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + offset + note.d);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + offset);
          osc.stop(ctx.currentTime + offset + note.d);
          offset += note.d * 0.85;
        });
      } catch (e) {
        console.error(e);
      }
    }

      if (!audioEnabled || !('speechSynthesis' in window)) return;
      let cleanText = rawText.replace(/\([^)]*\)/g, '').split('/')[0].trim();
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(cleanText);
      utterance.lang = 'en-US';
      utterance.rate = 0.95;
      utterance.pitch = 1.0;
      window.speechSynthesis.speak(utterance);
    }

    function shuffle(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function computeGridDimensions(cardCount) {
      const isLandscape = window.innerWidth >= window.innerHeight;
      let cols = 4;
      let rows = 4;

      if (isLandscape) {
        if (cardCount <= 12) { cols = 4; rows = 3; }
        else if (cardCount <= 16) { cols = 4; rows = 4; }
        else if (cardCount <= 20) { cols = 5; rows = 4; }
        else { cols = 6; rows = 4; }
      } else {
        if (cardCount <= 12) { cols = 3; rows = 4; }
        else if (cardCount <= 16) { cols = 4; rows = 4; }
        else if (cardCount <= 20) { cols = 4; rows = 5; }
        else { cols = 4; rows = 6; }
      }
      return { cols, rows };
    }

    function updateGridLayout() {
      if (!cards || cards.length === 0) return;
      const totalCards = cards.length;
      const { cols, rows } = computeGridDimensions(totalCards);

      const availableWidth = mainArea.clientWidth || window.innerWidth;
      const availableHeight = mainArea.clientHeight || (window.innerHeight - 130);

      const gap = window.innerWidth >= 640 ? 10 : 6;
      gridContainer.style.gap = `${gap}px`;

      if (availableWidth > 50 && availableHeight > 50) {
        const colWidth = Math.floor((availableWidth - (cols - 1) * gap) / cols);
        const rowHeight = Math.floor((availableHeight - (rows - 1) * gap) / rows);
        gridContainer.style.gridTemplateColumns = `repeat(${cols}, ${colWidth}px)`;
        gridContainer.style.gridTemplateRows = `repeat(${rows}, ${rowHeight}px)`;
      } else {
        gridContainer.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
        gridContainer.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
      }
    }

    function handleCardClick(cardElem, card) {
      if (!gameActive || isProcessing) return;
      if (cardElem.classList.contains('card-matched')) return;

      if (firstSelected && firstSelected.cardElem.id === card.id) {
        return;

      if (card.type === 'en') {

      playClickSound();

      if (currentMode === 'memory') {
        const inner = cardElem.querySelector('.card-inner');
        inner.classList.remove('flipped');

      const highlightClass = card.type === 'en' ? 'card-selected' : 'card-selected-zh';
      cardElem.classList.add(highlightClass);

      if (!firstSelected) {
        firstSelected = { cardElem, card, highlightClass };
      } else {
        secondSelected = { cardElem, card, highlightClass };
        evaluatePair();
      }

    function evaluatePair() {
      isProcessing = true;
      const card1 = firstSelected.card;
      const card2 = secondSelected.card;
      const elem1 = firstSelected.cardElem;
      const elem2 = secondSelected.cardElem;

      const isMatched = (card1.pairId === card2.pairId) && (card1.type !== card2.type);

      if (isMatched) {
        playMatchSound();
        comboCount++;
        if (comboCount > maxCombo) maxCombo = comboCount;
        comboDisplay.textContent = comboCount;

        if (card2.type === 'zh') {
          speakEnglish(card1.spokenText);
        }

        setTimeout(() => {
          elem1.classList.remove(firstSelected.highlightClass);
          elem2.classList.remove(secondSelected.highlightClass);

          elem1.classList.add('card-matched');
          elem2.classList.add('card-matched');

          matchedPairsCount++;
          const currentTotal = cards.length / 2;
          progressDisplay.textContent = `${matchedPairsCount} / ${currentTotal}`;

          firstSelected = null;
          secondSelected = null;
          isProcessing = false;

          if (matchedPairsCount === currentTotal) {
            handleVictory();
          }
        }, 320);

      } else {
        playErrorSound();
        comboCount = 0;
        comboDisplay.textContent = "0";
        mistakes++;

        elem1.classList.add('card-shake');
        elem2.classList.add('card-shake');

        setTimeout(() => {
          elem1.classList.remove(firstSelected.highlightClass, 'card-shake');
          elem2.classList.remove(secondSelected.highlightClass, 'card-shake');

          if (currentMode === 'memory') {
            elem1.querySelector('.card-inner').classList.add('flipped');
            elem2.querySelector('.card-inner').classList.add('flipped');
          }

          firstSelected = null;
          secondSelected = null;
          isProcessing = false;
        }, 650);
      }
    }

    function parseCustomInput(text) {
      const lines = text.split('\n');
      const pairs = [];
      const seenEn = new Set();
      const incompleteLines = [];
      let duplicateCount = 0;

      lines.forEach((line, lineIdx) => {
        const lineNum = lineIdx + 1;
        const trimmed = line.trim();
        if (!trimmed) return;

        let en = '';
        let zh = '';

        // 優先檢查明確的分隔標點符號：逗號、中文逗號、冒號、全形冒號、頓號、Tab
        if (/[,，:：、\t]/.test(trimmed)) {
          const parts = trimmed.split(/[,，:：、\t]/);
          const rawFirst = (parts[0] || '').trim();
          const rawSecond = parts.slice(1).join(',').trim();

          // 判斷哪一邊是中文、哪一邊是英文
          if (/[\u4e00-\u9fff]/.test(rawFirst) && !/[\u4e00-\u9fff]/.test(rawSecond)) {
            zh = rawFirst;
            en = rawSecond;
          } else {
            en = rawFirst;
            zh = rawSecond;
          }
        } else {
          // 以空格（半形/全形）隔開的情況
          // 1. 英文在前、中文在後（支援片語如 "living room 客廳"、"ice cream 冰淇淋"）
          const enThenZh = trimmed.match(/^([A-Za-z0-9\s\/\(\)\'\-\.\?\!]+?)\s+([\u4e00-\u9fff].*)$/);
          if (enThenZh) {
            en = enThenZh[1].trim();
            zh = enThenZh[2].trim();
          } else {
            // 2. 中文在前、英文在後（如 "貓咪 cat"）
            const zhThenEn = trimmed.match(/^([\u4e00-\u9fff\s\/\(\)\'\-\.\?\!]+?)\s+([A-Za-z].*)$/);
            if (zhThenEn) {
              zh = zhThenEn[1].trim();
              en = zhThenEn[2].trim();
            } else {
              // 3. 嘗試以首個空白分割
              const spaceIdx = trimmed.search(/\s/);
              if (spaceIdx > 0) {
                en = trimmed.substring(0, spaceIdx).trim();
                zh = trimmed.substring(spaceIdx).trim();
              }
            }
          }
        }

        // 診斷是否缺少元素並標註
        if (!en && !zh) {
          // 整行只有單一字串且未被成功分割
          const hasChinese = /[\u4e00-\u9fff]/.test(trimmed);
          const hasEnglish = /[A-Za-z]/.test(trimmed);

          if (hasEnglish && !hasChinese) {
            incompleteLines.push({
              line: lineNum,
              content: trimmed,
              reason: '缺少「中文解釋」與分隔符號'
            });
          } else if (hasChinese && !hasEnglish) {
            incompleteLines.push({
              line: lineNum,
              content: trimmed,
              reason: '缺少「英文單字」與分隔符號'
            });
          } else {
            incompleteLines.push({
              line: lineNum,
              content: trimmed,
              reason: '缺少有效分隔符號（請以空白或逗號隔開中英文）'
            });
          }
        } else if (en && !zh) {
          incompleteLines.push({
            line: lineNum,
            content: trimmed,
            reason: '缺少「中文解釋」'
          });
        } else if (!en && zh) {
          incompleteLines.push({
            line: lineNum,
            content: trimmed,
            reason: '缺少「英文單字」'
          });
        } else {
          // 兩者皆齊全，驗證是否有文字實際缺少英文字母或中文字符
          const hasEnChar = /[A-Za-z]/.test(en);
          const hasZhChar = /[\u4e00-\u9fff]/.test(zh);

          if (!hasEnChar && hasZhChar) {
            incompleteLines.push({
              line: lineNum,
              content: trimmed,
              reason: '英文欄位中未偵測到英文字母'
            });
          } else if (hasEnChar && !hasZhChar) {
            incompleteLines.push({
              line: lineNum,
              content: trimmed,
              reason: '中文欄位中未偵測到中文字符'
            });
          } else {
            // 完整正確的組
            const normKey = en.toLowerCase().trim();
            if (seenEn.has(normKey)) {
              duplicateCount++;
            } else {
              seenEn.add(normKey);
              pairs.push({ en, zh });
            }
          }
        }
      });

      pairs.duplicateCount = duplicateCount;
      pairs.incompleteLines = incompleteLines;
      return pairs;
    }

    function renderInputFeedback() {
      const parsed = parseCustomInput(customInput.value);
      const dupText = parsed.duplicateCount > 0 ? ` (已自動過濾 ${parsed.duplicateCount} 組重複單字)` : '';
      
      // 更新有效組數提示
      customCountNotice.textContent = `目前已偵測 ${parsed.length} 組有效單字${dupText}`;
      if (parsed.length < 6) {
        customCountNotice.classList.add('text-rose-400');
        customCountNotice.textContent += ' (至少需 6 組有效單字)';
      } else {
        customCountNotice.classList.remove('text-rose-400');
      }

      // 檢查並顯示不完整缺項提示面板
      if (parsed.incompleteLines && parsed.incompleteLines.length > 0) {
        customIncompleteBox.classList.remove('hidden');
        customIncompleteList.innerHTML = parsed.incompleteLines.map(item => {
          const safeContent = item.content.length > 18 ? item.content.slice(0, 18) + '...' : item.content;
          return `<li><span class="font-bold text-amber-300">第 ${item.line} 行</span>「<span class="underline decoration-dotted">${safeContent}</span>」：<span class="text-rose-300">${item.reason}</span></li>`;
        }).join('');
      } else {
        customIncompleteBox.classList.add('hidden');
        customIncompleteList.innerHTML = '';
      }
    }

    function openCustomModal(isEdit = false) {
      deleteCustomBtn.textContent = '刪除此題庫';
      deleteCustomBtn.dataset.confirming = 'false';

      if (isEdit && savedCategories[currentCategoryId]) {
        editingCategoryId = currentCategoryId;
        const cat = savedCategories[currentCategoryId];
        customModalTitle.innerHTML = '<span>✏️</span> <span>編輯修改目前題庫</span>';
        customCategoryName.value = cat.name;
        // Format words back to text: one pair per line separated by space
        customInput.value = cat.words.map(w => `${w.en} ${w.zh}`).join('\n');
        saveCustomBtn.textContent = '儲存修改並套用';

        // Allow deletion if more than 1 category exists
        if (Object.keys(savedCategories).length > 1) {
          deleteCustomBtn.classList.remove('hidden');
        } else {
          deleteCustomBtn.classList.add('hidden');
        }
      } else {
        editingCategoryId = null;
        customModalTitle.innerHTML = '<span>➕</span> <span>新增自訂單字主題庫</span>';
        customCategoryName.value = `自訂主題 ${Object.keys(savedCategories).length + 1}`;
        customInput.value = '';
        saveCustomBtn.textContent = '建立新分類並開始';
        deleteCustomBtn.classList.add('hidden');
      }

      renderInputFeedback();
      customModal.classList.remove('hidden');
      customModal.style.display = 'flex';
    }

    customInput.addEventListener('input', () => {
      renderInputFeedback();
    });

    saveCustomBtn.addEventListener('click', () => {
      const parsed = parseCustomInput(customInput.value);
      if (parsed.length < 6) {
        customCountNotice.textContent = '❌ 請至少輸入 6 組完整單字方可建立或修改主題！';
        customCountNotice.classList.add('text-rose-400');
        renderInputFeedback();
        return;
      }

      const name = customCategoryName.value.trim() || `主題 ${Object.keys(savedCategories).length + 1}`;

      if (editingCategoryId && savedCategories[editingCategoryId]) {
        // Edit existing category in place
        savedCategories[editingCategoryId].name = name;
        savedCategories[editingCategoryId].words = parsed;
        currentCategoryId = editingCategoryId;
      } else {
        // Create new category
        const newId = `cat_${Date.now()}`;
        savedCategories[newId] = {
          name: name,
          words: parsed
        };
        currentCategoryId = newId;
      }

      updateCategoryDropdown();

      customModal.classList.add('hidden');
      customModal.style.display = 'none';

      initGame();
    });

    // Delete category with two-step click confirmation (no native browser confirm)
    deleteCustomBtn.addEventListener('click', () => {
      if (deleteCustomBtn.dataset.confirming === 'true') {
        if (editingCategoryId && savedCategories[editingCategoryId]) {
          delete savedCategories[editingCategoryId];
          const remainingKeys = Object.keys(savedCategories);
          currentCategoryId = remainingKeys[0] || '';
          updateCategoryDropdown();
          customModal.classList.add('hidden');
          customModal.style.display = 'none';
          initGame();
        }
      } else {
        deleteCustomBtn.dataset.confirming = 'true';
        deleteCustomBtn.textContent = '確認刪除？(再按一次)';
        deleteCustomBtn.classList.replace('bg-rose-900/60', 'bg-rose-600');
        deleteCustomBtn.classList.replace('text-rose-300', 'text-white');
      }
    });

    cancelCustomBtn.addEventListener('click', () => {
      customModal.classList.add('hidden');
      customModal.style.display = 'none';
      updateCategoryDropdown();
    });

    closeCustomModalBtn.addEventListener('click', () => {
      customModal.classList.add('hidden');
      customModal.style.display = 'none';
      updateCategoryDropdown();
    });

    editCategoryBtn.addEventListener('click', () => {
      openCustomModal(true);
    });

    categorySelect.addEventListener('change', (e) => {
      if (e.target.value === '__CREATE_NEW__') {
        openCustomModal(false);
      } else {
        currentCategoryId = e.target.value;
        initGame();
      }
    });

    modeSelect.addEventListener('change', (e) => {
      currentMode = e.target.value;
      initGame();
    });

    pairsCountSelect.addEventListener('change', (e) => {
      targetPairsCount = parseInt(e.target.value, 10);
      initGame();
    });

    restartBtn.addEventListener('click', () => {
      initGame();
    });

    victoryPlayAgainBtn.addEventListener('click', () => {
      victoryModal.classList.add('hidden');
      victoryModal.style.display = 'none';
      initGame();
    });

    // Audio toggle
    toggleAudioBtn.addEventListener('click', () => {
      audioEnabled = !audioEnabled;
      if (audioEnabled) {
        audioIconOn.classList.remove('hidden');
        audioIconOff.classList.add('hidden');
        toggleAudioBtn.classList.replace('text-slate-400', 'text-sky-400');
      } else {
        audioIconOn.classList.add('hidden');
        audioIconOff.classList.remove('hidden');
        toggleAudioBtn.classList.replace('text-sky-400', 'text-slate-400');
        window.speechSynthesis.cancel();
      }
    });

    // Window Resize Handler
    let resizeTimeout = null;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimeout);
      resizeTimeout = setTimeout(() => {
        updateGridLayout();
      }, 60);
    });

    // Bootstrap
    function bootstrap() {
      updateCategoryDropdown();
      initGame();
      requestAnimationFrame(updateGridLayout);
      setTimeout(updateGridLayout, 100);
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', bootstrap);
    } else {
      bootstrap();
    }
    window.addEventListener('load', () => {
      updateGridLayout();
    });
  </script>
</body>
</html>
